<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Liên kết thiệp cưới · Hải Nam &amp; Hà Trang</title>
  <link rel="icon" href="./assets/favicon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500&display=swap">
  <link rel="stylesheet" href="./style.css?v=guest-tables">
  <script type="module" src="./links.js?v=guest-tables"></script>
</head>
<body>
  <main class="utility">
    <h1>Liên kết thiệp cưới</h1>
    <p>Sao chép liên kết của từng khách để gửi qua Zalo hoặc Messenger.</p>
    <p id="link-status" class="status" role="status">Đang tải danh sách khách mời…</p>
    <section class="guest-group" aria-labelledby="heading-both">
      <h2 id="heading-both">Cả hai</h2>
      <div class="table-wrap">
        <table aria-labelledby="heading-both">
          <thead><tr><th scope="col" class="guest-index">STT</th><th scope="col">Khách mời</th><th scope="col">Ghi chú</th><th scope="col">Liên kết</th></tr></thead>
          <tbody id="guests-both"></tbody>
        </table>
      </div>
    </section>
    <section class="guest-group" aria-labelledby="heading-nha-trai">
      <h2 id="heading-nha-trai">Nhà trai</h2>
      <div class="table-wrap">
        <table aria-labelledby="heading-nha-trai">
          <thead><tr><th scope="col" class="guest-index">STT</th><th scope="col">Khách mời</th><th scope="col">Ghi chú</th><th scope="col">Liên kết</th></tr></thead>
          <tbody id="guests-nha-trai"></tbody>
        </table>
      </div>
    </section>
    <section class="guest-group" aria-labelledby="heading-nha-gai">
      <h2 id="heading-nha-gai">Nhà gái</h2>
      <div class="table-wrap">
        <table aria-labelledby="heading-nha-gai">
          <thead><tr><th scope="col" class="guest-index">STT</th><th scope="col">Khách mời</th><th scope="col">Ghi chú</th><th scope="col">Liên kết</th></tr></thead>
          <tbody id="guests-nha-gai"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
