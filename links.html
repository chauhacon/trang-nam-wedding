<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Liên kết thiệp cưới · Hải Nam &amp; Hà Trang</title>
  <link rel="icon" href="./assets/favicon.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500&display=swap">
  <link rel="stylesheet" href="./style.css?v=guest-name-color">
  <script type="module" src="./links.js?v=guest-actions"></script>
</head>
<body>
  <main class="utility">
    <h1>Liên kết thiệp cưới</h1>
    <p>Sao chép liên kết của từng khách để gửi qua Zalo hoặc Messenger.</p>
    <p id="link-status" class="status" role="status">Đang tải danh sách khách mời…</p>
    <div class="guest-tabs" role="tablist" aria-label="Nhóm khách mời">
      <button type="button" role="tab" id="tab-testing" aria-controls="panel-testing" aria-selected="false" tabindex="-1">Kiểm thử</button>
      <button type="button" role="tab" id="tab-bride" aria-controls="panel-bride" aria-selected="true">Khách nhà gái</button>
      <button type="button" role="tab" id="tab-groom" aria-controls="panel-groom" aria-selected="false" tabindex="-1">Khách nhà trai</button>
    </div>
    <section class="guest-group" role="tabpanel" id="panel-testing" aria-labelledby="tab-testing" tabindex="0" hidden>
      <div class="table-wrap">
        <table aria-labelledby="tab-testing">
          <thead><tr><th scope="col" class="guest-index">STT</th><th scope="col">Lời mời</th><th scope="col">Khách mời</th><th scope="col">Ghi chú</th><th scope="col">Liên kết</th></tr></thead>
          <tbody id="guests-testing"></tbody>
        </table>
      </div>
    </section>
    <section class="guest-group" role="tabpanel" id="panel-bride" aria-labelledby="tab-bride" tabindex="0">
      <div class="table-wrap">
        <table aria-labelledby="tab-bride">
          <thead><tr><th scope="col" class="guest-index">STT</th><th scope="col">Lời mời</th><th scope="col">Khách mời</th><th scope="col">Ghi chú</th><th scope="col">Liên kết</th></tr></thead>
          <tbody id="guests-bride"></tbody>
        </table>
      </div>
    </section>
    <section class="guest-group" role="tabpanel" id="panel-groom" aria-labelledby="tab-groom" tabindex="0" hidden>
      <div class="table-wrap">
        <table aria-labelledby="tab-groom">
          <thead><tr><th scope="col" class="guest-index">STT</th><th scope="col">Lời mời</th><th scope="col">Khách mời</th><th scope="col">Ghi chú</th><th scope="col">Liên kết</th></tr></thead>
          <tbody id="guests-groom"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
